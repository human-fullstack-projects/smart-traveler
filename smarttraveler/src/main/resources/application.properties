spring.application.name=smarttraveler

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/smart_travel_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:sixon}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# eXERD-based entities create and incrementally update the local MariaDB schema.
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
logging.file.name=${ADMIN_ACCESS_LOG:logs/admin-access.log}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.format_sql=true
