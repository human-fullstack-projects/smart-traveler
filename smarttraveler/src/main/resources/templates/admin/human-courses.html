<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴먼 추천 코스 관리 · Smart Traveler</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><header th:replace="~{admin/fragments :: header('human')}"></header>
<main class="shell"><div class="hero"><span class="eyebrow">관리자 / 휴먼 추천 코스 관리</span><h1>휴먼 추천 코스 관리</h1><p>게시 코스의 신고, 블라인드와 추천 노출을 관리합니다.</p></div>
<p class="notice" th:if="${message}" th:text="${message}"></p><p class="notice" th:if="${error}" th:text="${error}"></p>
<div class="layout"><aside th:replace="~{admin/fragments :: sidebar('human')}"></aside><div class="content">
<section><h2>게시 코스 목록</h2>
<form class="filters" method="get" th:action="@{/admin/human-courses}">
<label>상태<select name="status"><option value="">전체</option><option value="VISIBLE" th:selected="${status == 'VISIBLE'}">게시 중</option><option value="BLINDED" th:selected="${status == 'BLINDED'}">블라인드</option><option value="DELETED" th:selected="${status == 'DELETED'}">삭제</option></select></label>
<label>신고<select name="reportStatus"><option value="">전체</option><option value="OPEN" th:selected="${reportStatus == 'OPEN'}">미처리 신고</option><option value="RESOLVED" th:selected="${reportStatus == 'RESOLVED'}">처리된 신고</option><option value="DISMISSED" th:selected="${reportStatus == 'DISMISSED'}">기각된 신고</option><option value="NONE" th:selected="${reportStatus == 'NONE'}">신고 없음</option></select></label>
<label>작성 시작일<input type="date" name="from" th:value="${from}"></label><label>작성 종료일<input type="date" name="to" th:value="${to}"></label>
<label>지역 · 제목<input name="query" th:value="${query}" placeholder="검색어 입력"></label><button class="line">검색</button>
</form>
<div class="table-wrap"><table><thead><tr><th>제목</th><th>지역</th><th>작성자 번호</th><th>상태</th><th>메인 노출</th><th>작성일</th><th>상세</th></tr></thead><tbody>
<tr th:each="course : ${humanCourses}"><td th:text="${course.title}"></td><td th:text="${course.destination}"></td><td th:text="${course.memberId}"></td>
<td><span class="badge" th:classappend="${course.status == 'VISIBLE' ? 'ok' : 'bad'}" th:text="${@fmt.label(course.status)}"></span></td>
<td th:text="${course.featured ? '노출' : '미노출'}"></td><td th:text="${@fmt.dt(course.createdAt)}"></td><td><a th:href="@{/admin/human-courses#detail(id=${course.id})}">보기</a></td></tr>
<tr th:if="${#lists.isEmpty(humanCourses)}"><td colspan="7">등록된 코스가 없습니다.</td></tr></tbody></table></div></section>
<section id="detail"><h2>신고 상세 · 처리</h2><div th:if="${selectedHumanCourse == null}" class="box">목록에서 코스를 선택하세요.</div>
<div th:if="${selectedHumanCourse != null}"><dl><dt>코스명</dt><dd th:text="${selectedHumanCourse.title}"></dd><dt>지역</dt><dd th:text="${selectedHumanCourse.destination}"></dd>
<dt>내용</dt><dd th:text="${selectedHumanCourse.summary}"></dd><dt>상태</dt><dd th:text="${@fmt.label(selectedHumanCourse.status)}"></dd></dl>
<h3>신고 목록</h3><div class="table-wrap"><table><thead><tr><th>신고일</th><th>신고자</th><th>사유</th><th>처리 상태</th><th>처리</th></tr></thead><tbody>
<tr th:each="report : ${reports}"><td th:text="${@fmt.dt(report.createdAt)}"></td><td th:text="${report.reporterId}"></td><td th:text="${report.reason}"></td><td th:text="${@fmt.label(report.status)}"></td><td>
<form method="post" th:if="${report.status == 'OPEN'}" th:action="@{/admin/human-reports/{id}/resolve(id=${report.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>처리 사유<input name="reason" required placeholder="처리 사유"></label><button name="status" value="RESOLVED">처리</button><button name="status" value="DISMISSED" class="line">기각</button></form></td></tr>
<tr th:if="${#lists.isEmpty(reports)}"><td colspan="5">신고가 없습니다.</td></tr></tbody></table></div>
<form method="post" th:action="@{/admin/human-courses/{id}/status(id=${selectedHumanCourse.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>처리 사유 (필수)<textarea name="reason" required></textarea></label>
<div class="actions"><button name="status" value="BLINDED" th:if="${selectedHumanCourse.status == 'VISIBLE'}">블라인드</button>
<button name="status" value="VISIBLE" th:if="${selectedHumanCourse.status == 'BLINDED'}">블라인드 해제</button>
<button name="status" value="DELETED" th:if="${selectedHumanCourse.status != 'DELETED'}">삭제</button></div></form>
<h3>처리 이력</h3><div class="table-wrap"><table><thead><tr><th>일시</th><th>처리</th><th>사유</th></tr></thead><tbody>
<tr th:each="history : ${humanHistory}"><td th:text="${@fmt.dt(history.createdAt)}"></td><td th:text="${history.action}"></td><td th:text="${history.note}"></td></tr>
<tr th:if="${#lists.isEmpty(humanHistory)}"><td colspan="3">처리 이력이 없습니다.</td></tr></tbody></table></div></div></section>
<section th:if="${selectedHumanCourse != null}"><h2>추천 노출</h2><p>코스를 메인 추천 영역에 지정하거나 해제합니다.</p>
<form method="post" th:action="@{/admin/human-courses/{id}/feature(id=${selectedHumanCourse.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="featured" th:value="${!selectedHumanCourse.featured}">
<button th:text="${selectedHumanCourse.featured ? '메인 노출 해제' : '메인 노출 지정'}"></button></form></section>
</div></div><footer class="bottom">Smart Traveler · 관리자</footer></main></body></html>
